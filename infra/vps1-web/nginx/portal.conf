server {
    listen 80;
    server_name portal.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.midominio.com;

    ssl_certificate /etc/letsencrypt/live/portal.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.midominio.com/privkey.pem;

    root /var/www/transporte-tracking/backend/public;
    index index.php;

    location /.well-known/mercure {
        proxy_pass http://127.0.0.1:3000/.well-known/mercure;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}
