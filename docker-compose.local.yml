services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/backend
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      APP_SECRET: local-dev-secret-change-me
      DATABASE_URL: postgresql://mxo:mxo@db:5432/mxo_track?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      MERCURE_SUBSCRIBER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      TRACCAR_BASE_URL: http://traccar:8082
      TRACCAR_WS_URL: ws://traccar:8082/api/socket
      TRACCAR_USERNAME: admin
      TRACCAR_PASSWORD: admin
      VROOM_URL: http://vroom:3000
      OSRM_URL: http://osrm:5000
    depends_on:
      - db
      - redis
      - mercure
      - traccar
      - vroom
    ports:
      - "8000:8000"
    tty: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mxo_track
      POSTGRES_USER: mxo
      POSTGRES_PASSWORD: mxo
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      MERCURE_SUBSCRIBER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://0.0.0.0:8000 http://127.0.0.1:8000
        anonymous
    ports:
      - "3000:80"

  traccar:
    image: traccar/traccar:latest
    volumes:
      - ./docker/traccar-local/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_logs:/opt/traccar/logs
    depends_on:
      traccar_db:
        condition: service_started
    ports:
      - "8082:8082"
      - "5055:5055"

  osrm:
    image: osrm/osrm-backend
    volumes:
      - ./docker/osrm/data:/data:ro
    command: osrm-routed --algorithm mld /data/comunidad-de-madrid-latest.osrm
    ports:
      - "5000:5000"
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    volumes:
      - ./docker/vroom/config.yml:/conf/config.yml:ro
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      - osrm
    ports:
      - "5100:3000"

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/backend
    command: php bin/console messenger:consume async ml failed --time-limit=3600 --memory-limit=128M -v
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      APP_SECRET: local-dev-secret-change-me
      DATABASE_URL: postgresql://mxo:mxo@db:5432/mxo_track?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      MERCURE_SUBSCRIBER_JWT_KEY: local-mercure-jwt-key-change-me-dev
      TRACCAR_BASE_URL: http://traccar:8082
      TRACCAR_WS_URL: ws://traccar:8082/api/socket
      TRACCAR_USERNAME: admin
      TRACCAR_PASSWORD: admin
      VROOM_URL: http://vroom:3000
      OSRM_URL: http://osrm:5000
    depends_on:
      - db
      - redis
    restart: unless-stopped

  traccar_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: traccar
    volumes:
      - traccar_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  pgdata_local:
  traccar_pgdata:
  traccar_logs:
