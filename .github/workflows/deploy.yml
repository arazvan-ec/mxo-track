name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deploy'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint & validate before deploying
  # ──────────────────────────────────────────────
  test:
    name: Lint & Validate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mxo_track_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, zip, intl, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax lint
        run: find backend/src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Symfony 7.4 lock
        run: bash scripts/check_symfony_74_lock.sh

      - name: Verify Symfony boots
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/mxo_track_test?serverVersion=16
          REDIS_URL: redis://127.0.0.1:6379
          MERCURE_URL: http://localhost:3000/.well-known/mercure
          MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
          MERCURE_PUBLISHER_JWT_KEY: test-key
          MERCURE_SUBSCRIBER_JWT_KEY: test-key
          TRACCAR_BASE_URL: http://localhost:8082
          TRACCAR_WS_URL: ws://localhost:8082/api/socket
          TRACCAR_USERNAME: test
          TRACCAR_PASSWORD: test
        run: php bin/console about

  # ──────────────────────────────────────────────
  # 2. Deploy to VPS1 via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS1_HOST }}
          username: ${{ secrets.VPS1_USER }}
          key: ${{ secrets.VPS1_SSH_KEY }}
          port: ${{ secrets.VPS1_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/transporte-tracking
            bash scripts/deploy_vps1_web.sh main

      - name: Health check
        run: |
          echo "Waiting 10s for app to stabilize..."
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${{ secrets.PORTAL_DOMAIN }}/" || echo "000")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Health check passed (HTTP $STATUS)"
          else
            echo "Health check FAILED (HTTP $STATUS)"
            exit 1
          fi

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy successful: https://${{ secrets.PORTAL_DOMAIN }}"
          else
            echo "❌ Deploy FAILED — check logs above"
          fi
