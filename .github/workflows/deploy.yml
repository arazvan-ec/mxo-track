name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mxo_track_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vocab deprecation gate
        run: bash scripts/ci-vocab-deprecation-check.sh

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, zip, intl, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax lint
        run: find backend/src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify Symfony boots
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/mxo_track_test?serverVersion=16
          REDIS_URL: redis://127.0.0.1:6379
          MERCURE_URL: http://localhost:3000/.well-known/mercure
          MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
          MERCURE_PUBLISHER_JWT_KEY: test-key
          MERCURE_SUBSCRIBER_JWT_KEY: test-key
          TRACCAR_BASE_URL: http://localhost:8082
          TRACCAR_WS_URL: ws://localhost:8082/api/socket
          TRACCAR_USERNAME: test
          TRACCAR_PASSWORD: test
        run: php bin/console about
