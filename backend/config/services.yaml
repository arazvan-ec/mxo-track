parameters:
  mercure.subscriber.ttl: '%env(int:MERCURE_SUBSCRIBER_TOKEN_TTL)%'
  app.rate_limit.login_max_failures: 10
  app.rate_limit.login_window_seconds: 3600

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'

  Predis\Client:
    arguments:
      - '%env(REDIS_URL)%'

  Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
    arguments:
      - '@Predis\Client'
      - { prefix: '%env(string:REDIS_SESSION_PREFIX)%' }

  App\Service\MercureJwtFactory:
    arguments:
      $subscriberKey: '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'
      $ttlSeconds: '%mercure.subscriber.ttl%'


  # GPS Tracking (Ports & Adapters)
  App\Tracking\TraccarGpsProvider:
    arguments:
      $baseUrl: '%env(TRACCAR_BASE_URL)%'
      $username: '%env(TRACCAR_USERNAME)%'
      $password: '%env(TRACCAR_PASSWORD)%'

  App\Service\TraccarWebSocketClient:
    arguments:
      $wsUrl: '%env(TRACCAR_WS_URL)%'

  App\Service\SystemHealthService:
    arguments:
      $mercureInternalUrl: '%env(MERCURE_URL)%'

  # Route Optimization (Ports & Adapters)
  App\RouteOptimization\VroomRouteOptimizer:
    arguments:
      $vroomUrl: '%env(VROOM_URL)%'

  # Routing (Ports & Adapters)
  App\Routing\OsrmRoutingEngine:
    arguments:
      $osrmUrl: '%env(OSRM_URL)%'

  # ── Provider Framework (tenant-configurable providers) ──────────────

  # Factory wiring: inject env defaults into factories
  App\Provider\RouteOptimizer\VroomFactory:
    arguments:
      $defaultVroomUrl: '%env(VROOM_URL)%'

  App\Provider\Routing\OsrmFactory:
    arguments:
      $defaultOsrmUrl: '%env(OSRM_URL)%'

  App\Provider\Gps\TraccarFactory:
    arguments:
      $defaultBaseUrl: '%env(TRACCAR_BASE_URL)%'
      $defaultUsername: '%env(TRACCAR_USERNAME)%'
      $defaultPassword: '%env(TRACCAR_PASSWORD)%'

  # ProviderFactoryRegistry: collects all tagged factories + global defaults
  App\Provider\ProviderFactoryRegistry:
    arguments:
      $factories: !tagged_iterator app.provider_factory
      $defaults:
        route_optimizer: '%env(DEFAULT_ROUTE_OPTIMIZER)%'
        routing_engine: '%env(DEFAULT_ROUTING_ENGINE)%'
        gps_provider: '%env(DEFAULT_GPS_PROVIDER)%'
        realtime_publisher: '%env(DEFAULT_REALTIME_PUBLISHER)%'

  # ProviderResolver: decorated with in-memory cache
  App\Provider\ProviderResolverInterface:
    alias: App\Provider\CachedProviderResolver

  App\Provider\CachedProviderResolver:
    arguments:
      $inner: '@App\Provider\ProviderResolver'

  # Transparent Proxies: replace direct aliases with tenant-aware resolution
  App\RouteOptimization\RouteOptimizerInterface:
    alias: App\Provider\RouteOptimizer\TenantAwareRouteOptimizer

  App\Routing\RoutingEngineInterface:
    alias: App\Provider\Routing\TenantAwareRoutingEngine

  App\Tracking\GpsDeviceProviderInterface:
    alias: App\Provider\Gps\TenantAwareGpsProvider

  App\Realtime\RealtimePublisherInterface:
    alias: App\Provider\Realtime\TenantAwareRealtimePublisher

  App\Service\WebhookNotificationService:
    arguments:
      $webhookSecret: '%env(default::WEBHOOK_SECRET)%'

  # AI / LLM (Ports & Adapters)
  App\Ai\ClaudeLlmClient:
    arguments:
      $claudeApiKey: '%env(CLAUDE_API_KEY)%'

  App\Ai\LlmClientInterface:
    alias: App\Ai\ClaudeLlmClient

  App\Ai\OpenAiEmbeddingClient:
    arguments:
      $openaiApiKey: '%env(default::OPENAI_API_KEY)%'

  App\Ai\EmbeddingClientInterface:
    alias: App\Ai\OpenAiEmbeddingClient

  App\Service\MlApiClient:
    arguments:
      $mlServiceUrl: '%env(ML_SERVICE_URL)%'

  # Prediction / ML (Ports & Adapters) — Null for dev, swap to HttpMlServiceClient in prod
  App\Prediction\EtaPredictorInterface:
    alias: App\Prediction\NullEtaPredictor
  App\Prediction\AnomalyDetectorInterface:
    alias: App\Prediction\NullAnomalyDetector
  App\Prediction\DemandForecasterInterface:
    alias: App\Prediction\NullDemandForecaster

  # Geocoding (Ports & Adapters)
  App\Geocoding\NominatimGeocoder:
    arguments:
      $nominatimUrl: '%env(default::NOMINATIM_URL)%'

  App\Geocoding\CachedGeocoder:
    arguments:
      $inner: '@App\Geocoding\NominatimGeocoder'

  App\Geocoding\GeocoderInterface:
    alias: App\Geocoding\CachedGeocoder

  # --- Recipient Notification System (Track D) ---

  # Notification channels (tagged for injection)
  App\Notification\Channel\SmsChannel:
    tags: ['app.notification_channel']
  App\Notification\Channel\WhatsAppChannel:
    tags: ['app.notification_channel']
  App\Notification\Channel\LogChannel:
    tags: ['app.notification_channel']

  App\Notification\RecipientNotificationService:
    arguments:
      $channels: !tagged_iterator app.notification_channel
      $appBaseUrl: '%env(default::APP_BASE_URL)%'

  # Provider wiring — default to Null for dev, swap to Twilio in prod
  App\Notification\Provider\SmsProviderInterface:
    alias: App\Notification\Provider\NullSmsProvider
  App\Notification\Provider\WhatsAppProviderInterface:
    alias: App\Notification\Provider\NullWhatsAppProvider

  # Twilio config (ready to activate by changing aliases above)
  App\Notification\Provider\TwilioSmsProvider:
    arguments:
      $accountSid: '%env(default::TWILIO_ACCOUNT_SID)%'
      $authToken: '%env(default::TWILIO_AUTH_TOKEN)%'
      $fromNumber: '%env(default::TWILIO_FROM_NUMBER)%'
  App\Notification\Provider\TwilioWhatsAppProvider:
    arguments:
      $accountSid: '%env(default::TWILIO_ACCOUNT_SID)%'
      $authToken: '%env(default::TWILIO_AUTH_TOKEN)%'
      $fromNumber: '%env(default::TWILIO_WHATSAPP_FROM)%'
