security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  role_hierarchy:
    ROLE_ADMIN: [ROLE_OPERATOR, ROLE_CUSTOMER, ROLE_DRIVER]
    ROLE_OPERATOR: [ROLE_CUSTOMER]

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
      logout:
        path: app_logout
        target: app_login
      remember_me:
        secret: '%env(APP_SECRET)%'
        lifetime: 604800
        path: /

  access_control:
    - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_OPERATOR] }
    - { path: ^/driver, roles: ROLE_DRIVER }
    - { path: ^/api/driver, roles: ROLE_DRIVER }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
