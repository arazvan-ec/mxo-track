security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  role_hierarchy:
    ROLE_ADMIN: [ROLE_CUSTOMER, ROLE_DRIVER]

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api_v1_doc:
      pattern: ^/api/v1/doc
      security: false

    api_v1:
      pattern: ^/api/v1
      stateless: true
      custom_authenticators:
        - App\Security\ApiKeyAuthenticator

    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
      login_throttling:
        max_attempts: 5
      logout:
        path: app_logout
        target: app_login

  access_control:
    - { path: ^/api/v1/doc, roles: PUBLIC_ACCESS }
    - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/logout, roles: PUBLIC_ACCESS }
    - { path: ^/track/, roles: PUBLIC_ACCESS }
    - { path: ^/locale/, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/operator, roles: ROLE_ADMIN }
    - { path: ^/driver, roles: [ROLE_ADMIN, ROLE_DRIVER] }
    - { path: ^/api/driver, roles: [ROLE_ADMIN, ROLE_DRIVER] }
    - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
