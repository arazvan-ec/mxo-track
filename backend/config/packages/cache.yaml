framework:
    cache:
        prefix_seed: mxo_track

        # Use Redis as the main application cache (shared with sessions)
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # Dedicated pool for Doctrine result cache (short TTL)
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
                default_lifetime: 60
