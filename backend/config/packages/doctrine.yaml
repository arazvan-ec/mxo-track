doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    server_version: '16'
    charset: utf8
    types:
      encrypted_json: App\Doctrine\Types\EncryptedJsonType
  orm:
    auto_generate_proxy_classes: true
    auto_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    result_cache_driver:
      type: pool
      pool: doctrine.result_cache_pool
    dql:
      string_functions:
        JSON_TEXT: App\Doctrine\Dql\JsonToTextFunction
    filters:
      customer_tenant:
        class: App\Doctrine\CustomerTenantFilter
        enabled: false
      soft_delete:
        class: App\Doctrine\SoftDeleteFilter
        enabled: true
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Entity'
        alias: App
      RouteModel:
        type: xml
        is_bundle: false
        dir: '%kernel.project_dir%/config/doctrine/mapping'
        prefix: 'App\Domain\Route\Model'
      ShipmentModel:
        type: xml
        is_bundle: false
        dir: '%kernel.project_dir%/config/doctrine/shipment-mapping'
        prefix: 'App\Domain\Shipment\Model'
