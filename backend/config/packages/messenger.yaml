framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            ml:
                dsn: 'doctrine://default?queue_name=ml'
                retry_strategy:
                    max_retries: 2
                    delay: 5000
            failed:
                dsn: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Message\PostRouteAnalysisMessage': ml
            'App\Message\EnrichRouteNotesMessage': async
            'App\Message\NlpClassificationMessage': async
            'App\Message\FleetAnomalyCheckMessage': async
            'App\Notification\Message\SendRecipientNotificationMessage': async
            'App\Notification\Message\SendNotificationMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                ml: 'in-memory://'
