nelmio_api_doc:
    documentation:
        info:
            title: 'MXO Track API'
            description: 'Public REST API for shipment and route management'
            version: '1.0.0'
        servers:
            - url: /api/v1
              description: 'API v1'
        components:
            securitySchemes:
                ApiKey:
                    type: apiKey
                    in: header
                    name: X-Api-Key
        security:
            - ApiKey: []
    areas:
        path_patterns:
            - ^/api/v1
