# _graduations.yaml — single source of truth for tag/pattern graduation status.
#
# Consumed by:
#   - .claude/hooks/pattern-audit.sh  (detection: is this tag graduated?)
#   - scripts/suggest-tags.sh         (keyword → tag mapping for backfill)
#   - scripts/graduate.sh             (blessed path to add entries)
#   - scripts/test-graduations-validator.sh (drift detection)
#
# Rules:
#   - A tag lives in EITHER `tags:` OR `patterns:`, not both.
#   - `section: "*"` means the entire module documents the tag.
#   - `keyword_mappings` values are canonical tag names; they do NOT need to be
#     graduated yet. Only graduated items appear under `tags:` / `patterns:`.
#   - Always prefer graduate.sh over hand-editing.

