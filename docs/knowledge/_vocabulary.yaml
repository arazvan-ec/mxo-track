# Ubiquitous Language Registry — single source of truth for vocabulary
# across backend, frontend, API, and workflow.
#
# Origin: 2026-04-29 hito 3 (SPDD-derived backlog), Phase A.
# DDD reference: Evans' Ubiquitous Language. SPDD reference: REASONS
# Canvas (Entities dimension).
#
# Schema (per entry):
#   canonical            (required, string)        Authoritative name.
#   aliases              (list of objects)
#     term               (required, string)        Alternate term.
#     lang               ("es" | "en")             Language of the term.
#     surface            ("user" | "internal" | "deprecated")
#                                                  Where the term shows up.
#   definition           (required, one-line)      Plain meaning.
#   bounded_context      (string)                  Key from _ddd-boundaries.yaml.
#   layer                ("domain" | "application" | "infrastructure" |
#                         "ui" | "workflow")
#   authoritative_path   (string)                  File where canonical lives.
#   related              (list of {concept, relation})
#   lifecycle            ("active" | "deprecated") Default: active.
#   cross_references     (object, optional)
#     frontend           (string)                  e.g. "frontend/src/types/route.ts:Route"
#     api                (string)                  e.g. "GET /api/routes"
#     knowledge_module   (string)                  e.g. "docs/knowledge/route-optimization.md"
#
# Editing rules:
# - Hand-edit `aliases`, `definition`, `related`, `cross_references`.
# - The bootstrap script (`scripts/bootstrap-vocabulary.sh`) maintains
#   `canonical`, `authoritative_path`, `layer`, and adds new symbols.
#   It MUST NOT overwrite curated fields.
# - Never edit the rendered `docs/knowledge/ubiquitous-language.md`;
#   it is regenerated from this YAML by `make manifest`.

