# Business Rules: Shipment Domain
# Generated by /workflows:discover on 2026-02-19

business_rules:
  domain_area: "Shipment"
  description: "Rules governing shipment lifecycle, events, and import"

  rules:
    - id: "BR-SHIPMENT-001"
      name: "Shipment Lifecycle via Events"
      description: "Shipment status is determined by the latest ShipmentEvent. Events are append-only."
      type: "workflow"
      condition:
        when: "Shipment status queried"
        given: "ShipmentEvent records exist"
        then: "Latest event determines current status"
      implementation:
        location: "backend/src/Entity/ShipmentEvent.php"
        method: "constructor"
        pattern: "event sourcing (lightweight)"
      related_entities: ["Shipment", "ShipmentEvent"]
      priority: "critical"

    - id: "BR-SHIPMENT-002"
      name: "Unique Shipment Reference"
      description: "Each shipment must have a globally unique reference number."
      type: "constraint"
      condition:
        when: "Shipment created"
        given: "Reference string provided"
        then: "Reference must be unique across all customers"
      implementation:
        location: "backend/src/Entity/Shipment.php"
        method: "ORM UniqueConstraint + column unique=true"
        pattern: "database constraint"
      related_entities: ["Shipment"]
      priority: "critical"

    - id: "BR-SHIPMENT-003"
      name: "CSV Import Deduplication"
      description: "CSV import skips shipments with existing references to prevent duplicates."
      type: "validation"
      condition:
        when: "CSV file imported"
        given: "CSV contains shipment references"
        then: "Existing references are skipped, only new ones created"
      implementation:
        location: "backend/src/Service/ShipmentCsvImporter.php"
        method: "import()"
        pattern: "service method"
      related_entities: ["Shipment", "CsvImportRun"]
      priority: "high"

  source_files:
    - "backend/src/Entity/Shipment.php"
    - "backend/src/Entity/ShipmentEvent.php"
    - "backend/src/Service/ShipmentCsvImporter.php"

  extracted_at: "2026-02-19"
