# Business Rules: Multi-Tenant Isolation
# Generated by /workflows:discover on 2026-02-19

business_rules:
  domain_area: "Multi-Tenant"
  description: "Rules governing customer data isolation and tenant scoping"

  rules:
    - id: "BR-TENANT-001"
      name: "Automatic Tenant Filtering"
      description: "Doctrine SQL filter automatically scopes queries by customer_id for tenant users."
      type: "authorization"
      condition:
        when: "Any Doctrine query executed"
        given: "User has ROLE_CUSTOMER or ROLE_DRIVER with customer association"
        then: "CustomerTenantFilter adds WHERE customer_id = :id to all entities implementing CustomerScopedEntityInterface"
      implementation:
        location: "backend/src/Doctrine/CustomerTenantFilter.php"
        method: "addFilterConstraint()"
        pattern: "Doctrine SQL filter"
      related_entities: ["Customer", "Shipment", "CustomerVehicle", "CsvImportRun"]
      priority: "critical"

    - id: "BR-TENANT-002"
      name: "Admin/Operator Bypass"
      description: "Users with ROLE_ADMIN or ROLE_OPERATOR bypass tenant filtering and see all data."
      type: "authorization"
      condition:
        when: "User authenticates"
        given: "User has ROLE_ADMIN or ROLE_OPERATOR"
        then: "CustomerTenantFilter is NOT enabled"
      implementation:
        location: "backend/src/EventSubscriber/DoctrineCustomerFilterSubscriber.php"
        method: "onKernelRequest()"
        pattern: "event subscriber"
      related_entities: ["User"]
      priority: "critical"

    - id: "BR-TENANT-003"
      name: "Customer-Scoped Entities Must Implement Interface"
      description: "Entities that need tenant isolation must implement CustomerScopedEntityInterface."
      type: "constraint"
      condition:
        when: "New entity needs tenant scoping"
        given: "Entity has customer_id foreign key"
        then: "Must implement CustomerScopedEntityInterface with getCustomer() method"
      implementation:
        location: "backend/src/Entity/CustomerScopedEntityInterface.php"
        method: "getCustomer()"
        pattern: "interface contract"
      related_entities: ["Shipment", "CustomerVehicle", "CsvImportRun"]
      priority: "high"

  cross_cutting_rules:
    - id: "BR-CROSS-001"
      name: "Public ID Exposure Rule"
      description: "Internal BIGINT IDs must never be exposed in APIs or URLs. Only ULID public IDs are used externally."
      affected_areas: ["Delivery", "Shipment", "Vehicle Tracking", "Multi-Tenant"]
      description: "All API responses and URL parameters use publicId (ULID), never internal id (BIGINT)"

  source_files:
    - "backend/src/Entity/CustomerScopedEntityInterface.php"
    - "backend/src/Doctrine/CustomerTenantFilter.php"
    - "backend/src/EventSubscriber/DoctrineCustomerFilterSubscriber.php"

  extracted_at: "2026-02-19"
