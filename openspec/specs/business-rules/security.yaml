# Business Rules: Security Domain
# Generated by /workflows:discover on 2026-02-19
# Updated by /workflows:compound on 2026-02-20 (Phase 4 security review learnings)

business_rules:
  domain_area: "Security"
  description: "Rules governing authentication, authorization, CSRF, XSS prevention, and audit"

  rules:
    - id: "BR-SEC-001"
      name: "Active User Check"
      description: "Only active users (isActive=true) can authenticate."
      type: "authorization"
      condition:
        when: "User attempts to login"
        given: "User found by email"
        then: "UserChecker verifies isActive=true before allowing authentication"
      implementation:
        location: "backend/src/Security/UserChecker.php"
        method: "checkPreAuth()"
        pattern: "Symfony user checker"
      related_entities: ["User"]
      priority: "critical"

    - id: "BR-SEC-002"
      name: "Login Rate Limiting"
      description: "Maximum 5 login attempts per minute (sliding window)."
      type: "constraint"
      condition:
        when: "Login form submitted"
        given: "Rate limiter tracking"
        then: "After 5 failed attempts in 1 minute, further attempts blocked"
      implementation:
        location: "backend/config/packages/framework.yaml"
        method: "rate_limiter.login configuration"
        pattern: "Symfony rate limiter"
      related_entities: ["User"]
      priority: "critical"

    - id: "BR-SEC-003"
      name: "Role-Based Access Control"
      description: "Access control enforced by role hierarchy: ADMIN > OPERATOR > CUSTOMER, ADMIN > DRIVER."
      type: "authorization"
      condition:
        when: "Request to protected route"
        given: "User authenticated with roles"
        then: "Access granted based on role hierarchy in security.yaml"
      implementation:
        location: "backend/config/packages/security.yaml"
        method: "access_control + role_hierarchy"
        pattern: "Symfony security"
      related_entities: ["User"]
      priority: "critical"

    - id: "BR-SEC-004"
      name: "Audit Logging for Sensitive Operations"
      description: "Security-sensitive operations are logged in the audit trail."
      type: "constraint"
      condition:
        when: "Sensitive operation performed (create/update/delete)"
        given: "Operation modifies data"
        then: "AuditLog entry created with actor, action, entity type, and payload"
      implementation:
        location: "backend/src/Service/AuditLogger.php"
        method: "log()"
        pattern: "audit service"
      related_entities: ["AuditLog", "User"]
      priority: "high"

    - id: "BR-SEC-005"
      name: "Security Headers"
      description: "All responses include security headers (X-Frame-Options, CSP, etc.)."
      type: "constraint"
      condition:
        when: "Any HTTP response sent"
        given: "Response event fired"
        then: "SecurityHeadersSubscriber adds security headers"
      implementation:
        location: "backend/src/EventSubscriber/SecurityHeadersSubscriber.php"
        method: "onKernelResponse()"
        pattern: "event subscriber"
      related_entities: []
      priority: "high"

    # --- New rules from Phase 4 security review (2026-02-20) ---

    - id: "BR-SEC-006"
      name: "Class-Level IsGranted on All Controllers"
      description: "Every controller class MUST have #[IsGranted] at the class level. Method-level only is insufficient because new methods could be added without authorization."
      type: "authorization"
      condition:
        when: "New controller created or modified"
        given: "Controller serves protected routes"
        then: "Class-level #[IsGranted('ROLE_xxx')] attribute required"
      implementation:
        location: "All controllers in backend/src/Controller/"
        method: "PHP 8 attribute on class"
        pattern: "Symfony security attribute"
      related_entities: ["User"]
      priority: "critical"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

    - id: "BR-SEC-007"
      name: "IDOR Prevention via Ownership Chain"
      description: "Every user-scoped endpoint MUST verify entity ownership by traversing the entity relationship graph. Returns 404 (not 403) to prevent enumeration."
      type: "authorization"
      condition:
        when: "Driver/Customer accesses entity by publicId"
        given: "Entity found by publicId"
        then: "Verify entity belongs to authenticated user via ownership chain (e.g., stop->route->driver)"
      implementation:
        location: "backend/src/Controller/DriverApiController.php"
        method: "Inline check per endpoint"
        pattern: "Chain traversal with null-safe operator"
      related_entities: ["RouteStop", "Route", "User"]
      priority: "critical"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

    - id: "BR-SEC-008"
      name: "CSRF Token Scoped to Entity Identity"
      description: "CSRF tokens for destructive actions MUST include the entity publicId in the intention string to prevent cross-entity token reuse."
      type: "constraint"
      condition:
        when: "Destructive POST action (delete, cancel, import)"
        given: "Form includes _token hidden field"
        then: "Token validated with intention 'action-entity-{publicId}'"
      implementation:
        location: "All admin controllers"
        method: "isCsrfTokenValid('delete-{entity}-' . $publicId, ...)"
        pattern: "Symfony CSRF with scoped intention"
      related_entities: []
      priority: "high"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

    - id: "BR-SEC-009"
      name: "XSS Prevention for JSON in Templates"
      description: "JSON embedded in Twig templates via |raw MUST use JSON_HEX_TAG|JSON_HEX_APOS|JSON_HEX_AMP flags on the server side to prevent </script> injection."
      type: "constraint"
      condition:
        when: "Controller passes JSON string to template"
        given: "Template uses {{ json_var|raw }} inside <script> tags"
        then: "json_encode() must use JSON_HEX_TAG | JSON_HEX_APOS | JSON_HEX_AMP | JSON_THROW_ON_ERROR"
      implementation:
        location: "backend/src/Controller/FleetMapController.php"
        method: "json_encode with hex flags"
        pattern: "Server-side escaping for script context"
      related_entities: []
      priority: "high"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

    - id: "BR-SEC-010"
      name: "XSS Prevention in Dynamic HTML (Leaflet Popups)"
      description: "User-controlled data rendered in dynamic HTML (Leaflet popups, tooltips) MUST be escaped via a DOM-based esc() function."
      type: "constraint"
      condition:
        when: "JavaScript constructs HTML from server data"
        given: "Data includes user-provided strings (addresses, names)"
        then: "Use esc() helper: createElement('div'), textContent=s, return innerHTML"
      implementation:
        location: "backend/templates/tracking/map.html.twig"
        method: "JavaScript esc() function"
        pattern: "DOM-based HTML escaping"
      related_entities: []
      priority: "high"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

    - id: "BR-SEC-011"
      name: "Never Expose Internal Database IDs"
      description: "Public APIs, URLs, and form values MUST use publicIdString (ULID), never internal auto-increment IDs."
      type: "constraint"
      condition:
        when: "Data rendered in templates or API responses"
        given: "Entity has PublicIdTrait"
        then: "Use entity.publicIdString or entity.getPublicIdString(), never entity.id"
      implementation:
        location: "All controllers and templates"
        method: "PublicIdTrait convention"
        pattern: "ULID public identity"
      related_entities: ["All entities with PublicIdTrait"]
      priority: "high"
      learned_from: "phase-4-crud-dashboards"
      learned_date: "2026-02-20"

  source_files:
    - "backend/src/Security/UserChecker.php"
    - "backend/src/Service/AuditLogger.php"
    - "backend/src/EventSubscriber/SecurityHeadersSubscriber.php"
    - "backend/config/packages/security.yaml"
    - "backend/src/Controller/DriverApiController.php"
    - "backend/src/Controller/Admin/RouteAdminController.php"
    - "backend/src/Controller/FleetMapController.php"
    - "backend/templates/tracking/map.html.twig"

  extracted_at: "2026-02-19"
  updated_at: "2026-02-20"
  updated_by: "/workflows:compound (phase-4-crud-dashboards)"
