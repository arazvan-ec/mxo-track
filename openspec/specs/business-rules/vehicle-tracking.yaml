# Business Rules: Vehicle Tracking Domain
# Generated by /workflows:discover on 2026-02-19

business_rules:
  domain_area: "Vehicle Tracking"
  description: "Rules governing GPS position ingestion, fleet tracking, and Traccar integration"

  rules:
    - id: "BR-TRACK-001"
      name: "Position Deduplication"
      description: "Positions are deduplicated by (vehicle_id, device_time) unique constraint."
      type: "constraint"
      condition:
        when: "New position ingested from Traccar"
        given: "Position for same vehicle and device_time exists"
        then: "Position is skipped (no duplicate)"
      implementation:
        location: "backend/src/Entity/VehiclePosition.php"
        method: "ORM UniqueConstraint uniq_vehicle_pos_time"
        pattern: "database constraint"
      related_entities: ["VehiclePosition", "Vehicle"]
      priority: "high"

    - id: "BR-TRACK-002"
      name: "Last Position Upsert"
      description: "VehicleLastPosition is updated (not inserted) when a newer position arrives."
      type: "workflow"
      condition:
        when: "Position ingested"
        given: "VehicleLastPosition exists for the vehicle"
        then: "refresh() updates the existing record"
      implementation:
        location: "backend/src/Service/TraccarIngestionService.php"
        method: "ingest()"
        pattern: "service orchestration"
      related_entities: ["VehicleLastPosition", "Vehicle"]
      priority: "high"

    - id: "BR-TRACK-003"
      name: "Checkpoint-Based Ingestion"
      description: "Traccar position ingestion uses VehicleCheckpoint to track last processed position, enabling incremental polling."
      type: "workflow"
      condition:
        when: "TraccarStreamCommand polls for positions"
        given: "VehicleCheckpoint stores last processed deviceTime/positionId"
        then: "Only new positions since last checkpoint are fetched"
      implementation:
        location: "backend/src/Entity/VehicleCheckpoint.php"
        method: "setLastDeviceTime(), setLastTraccarPositionId()"
        pattern: "checkpoint pattern"
      related_entities: ["VehicleCheckpoint", "Vehicle"]
      priority: "high"

    - id: "BR-TRACK-004"
      name: "Mercure Real-time Publishing"
      description: "New positions are published to Mercure topics for real-time fleet map updates."
      type: "workflow"
      condition:
        when: "Position ingested and stored"
        given: "Mercure hub is configured"
        then: "Position published to /vehicles/{publicId}/position and /operator/fleet topics"
      implementation:
        location: "backend/src/Service/TraccarIngestionService.php"
        method: "publish to Mercure"
        pattern: "event publishing"
      related_entities: ["Vehicle", "VehiclePosition"]
      priority: "medium"

  source_files:
    - "backend/src/Service/TraccarIngestionService.php"
    - "backend/src/Service/TraccarApiClient.php"
    - "backend/src/Command/TraccarStreamCommand.php"
    - "backend/src/Entity/VehicleCheckpoint.php"

  extracted_at: "2026-02-19"
