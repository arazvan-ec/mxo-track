# Business Rules: Delivery Domain
# Generated by /workflows:discover on 2026-02-19

business_rules:
  domain_area: "Delivery"
  description: "Rules governing route execution, stop delivery, and proof-of-delivery"

  rules:
    - id: "BR-DELIVERY-001"
      name: "Route Lifecycle Transitions"
      description: "Routes can only transition PLANNED → ACTIVE → DONE. No backward transitions."
      type: "workflow"
      condition:
        when: "Route state change requested"
        given: "Route exists with valid status"
        then: "Only forward transitions allowed: PLANNED→ACTIVE, ACTIVE→DONE"
      implementation:
        location: "backend/src/Entity/Route.php"
        method: "start(), finish()"
        pattern: "guard clause"
      exceptions:
        - "CANCELLED status (not implemented in entity methods yet)"
      related_entities: ["Route"]
      priority: "critical"

    - id: "BR-DELIVERY-002"
      name: "Stop Delivery Creates POD"
      description: "When a driver delivers a stop, a Proof of Delivery record must be created with recipient info."
      type: "workflow"
      condition:
        when: "Driver submits delivery for a stop"
        given: "Stop exists and is PENDING"
        then: "Stop marked DELIVERED, Pod created with signed_by_name and recipient_id"
      implementation:
        location: "backend/src/Controller/DriverApiController.php"
        method: "deliverStop action"
        pattern: "controller orchestration"
      related_entities: ["RouteStop", "Pod"]
      priority: "critical"

    - id: "BR-DELIVERY-003"
      name: "Driver Action Idempotency"
      description: "Each driver action identified by clientActionId. Duplicate requests return 409 without side effects."
      type: "constraint"
      condition:
        when: "Driver submits deliver or exception action"
        given: "Same driver + clientActionId combination"
        then: "Return 409 Conflict without creating duplicate records"
      implementation:
        location: "backend/src/Service/DriverActionService.php"
        method: "recordAction / checkDuplicate"
        pattern: "idempotency key"
      related_entities: ["DriverAction"]
      priority: "critical"

    - id: "BR-DELIVERY-004"
      name: "Stop Exception Recording"
      description: "Failed delivery must record exception code and driver notes."
      type: "workflow"
      condition:
        when: "Driver reports delivery exception"
        given: "Stop exists"
        then: "Stop marked EXCEPTION with code and notes"
      implementation:
        location: "backend/src/Entity/RouteStop.php"
        method: "markException()"
        pattern: "entity method"
      related_entities: ["RouteStop"]
      priority: "high"

    - id: "BR-DELIVERY-005"
      name: "Delivery Clears Exception"
      description: "When a stop is successfully delivered after an exception, exception data is cleared."
      type: "validation"
      condition:
        when: "markDelivered() called on a stop"
        given: "Stop may have previous exception data"
        then: "exceptionCode and exceptionNotes are set to null"
      implementation:
        location: "backend/src/Entity/RouteStop.php"
        method: "markDelivered()"
        pattern: "entity method"
      related_entities: ["RouteStop"]
      priority: "medium"

  source_files:
    - "backend/src/Entity/Route.php"
    - "backend/src/Entity/RouteStop.php"
    - "backend/src/Entity/Pod.php"
    - "backend/src/Controller/DriverApiController.php"
    - "backend/src/Service/DriverActionService.php"

  extracted_at: "2026-02-19"
