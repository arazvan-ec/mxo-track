# API Consumer: Traccar GPS Tracking API
# Generated by /workflows:discover on 2026-02-19

api_consumer:
  name: "Traccar GPS Tracking API"
  description: "External GPS tracking platform. Provides device management and real-time position data via REST API."
  sdk: "symfony/http-client"

  integration:
    adapter: "backend/src/Service/TraccarApiClient.php"
    port_interface: ""
    response_mapper: ""
    acl_compliant: false

  calls:
    - method: "GET"
      url_pattern: "{baseUrl}/api/devices"
      purpose: "List all GPS devices registered in Traccar"
      used_by: "backend/src/Command/TraccarSyncDevicesCommand.php"

    - method: "POST"
      url_pattern: "{baseUrl}/api/devices"
      purpose: "Create a new GPS device in Traccar"
      used_by: "backend/src/Command/SimulateGpsCommand.php"

    - method: "GET"
      url_pattern: "{baseUrl}/api/positions"
      purpose: "Get positions for devices (with from/to time filters)"
      used_by: "backend/src/Service/TraccarIngestionService.php"

    - method: "POST"
      url_pattern: "{baseUrl}/api/session"
      purpose: "Authenticate with Traccar (form login with email/password)"
      used_by: "backend/src/Service/TraccarApiClient.php"

    - method: "GET"
      url_pattern: "{baseUrl}/api/server"
      purpose: "Check Traccar server status (newServer flag)"
      used_by: "backend/src/Service/SystemHealthService.php"

  async_grouping:
    grouped: false
    mechanism: "sequential"

  response_mapping:
    vendor_types_leaked: true
    domain_dto: ""

  source_files:
    - "backend/src/Service/TraccarApiClient.php"
    - "backend/src/Service/TraccarIngestionService.php"
    - "backend/src/Command/TraccarStreamCommand.php"
    - "backend/src/Command/TraccarSyncDevicesCommand.php"
    - "backend/src/Command/SimulateGpsCommand.php"

  extracted_at: "2026-02-19"
