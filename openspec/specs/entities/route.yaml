# Entity Specification: Route
# Generated by /workflows:discover on 2026-02-19

entity:
  name: "Route"
  type: "aggregate"
  description: "Delivery route assigned to a driver and vehicle. Contains ordered stops. Manages lifecycle from PLANNED to DONE."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      description: "Internal primary key"
    - name: "publicId"
      type: "ULID"
      required: true
      description: "Public identifier"
    - name: "name"
      type: "string(140)"
      required: true
      description: "Route name/description"
    - name: "status"
      type: "RouteStatus enum"
      required: true
      validation: "PLANNED|ACTIVE|DONE|CANCELLED"
      description: "Current route lifecycle state"
    - name: "driver"
      type: "User (ManyToOne)"
      required: false
      description: "Assigned driver user"
    - name: "vehicle"
      type: "Vehicle (ManyToOne)"
      required: false
      description: "Assigned vehicle"
    - name: "startAt"
      type: "DateTimeImmutable"
      required: false
      description: "When route was started"
    - name: "endAt"
      type: "DateTimeImmutable"
      required: false
      description: "When route was completed"

  relations:
    - target: "User"
      type: "many-to-one"
      cardinality: "0..1"
      description: "Assigned driver (SET NULL on delete)"
    - target: "Vehicle"
      type: "many-to-one"
      cardinality: "0..1"
      description: "Assigned vehicle (SET NULL on delete)"
    - target: "RouteStop"
      type: "one-to-many"
      cardinality: "0..*"
      description: "Ordered delivery stops"

  invariants:
    - "Route can only transition PLANNED → ACTIVE → DONE"
    - "start() only works when status is PLANNED"
    - "finish() only works when status is ACTIVE"
    - "startAt is set automatically when start() is called"
    - "endAt is set automatically when finish() is called"

  lifecycle:
    states: ["PLANNED", "ACTIVE", "DONE", "CANCELLED"]
    transitions:
      - from: "PLANNED"
        to: "ACTIVE"
        trigger: "start() method called"
      - from: "ACTIVE"
        to: "DONE"
        trigger: "finish() method called"

  source_files:
    - "backend/src/Entity/Route.php"
    - "backend/src/Repository/RouteRepository.php"
    - "backend/src/Enum/RouteStatus.php"

  extracted_at: "2026-02-19"
