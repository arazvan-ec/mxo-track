# Entity Specification: Pod (Proof of Delivery)
# Generated by /workflows:discover on 2026-02-19

entity:
  name: "Pod"
  type: "entity"
  description: "Proof of Delivery record. Stores recipient identification and driver confirmation for a completed delivery stop."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      description: "Internal primary key"
    - name: "publicId"
      type: "ULID"
      required: true
      description: "Public identifier"
    - name: "routeStop"
      type: "RouteStop (OneToOne)"
      required: true
      description: "The delivery stop this POD belongs to"
    - name: "shipment"
      type: "Shipment (ManyToOne)"
      required: false
      description: "Associated shipment (nullable, SET NULL on delete)"
    - name: "signedByName"
      type: "string(120)"
      required: true
      description: "Name of person who signed for the delivery"
    - name: "recipientIdEncoded"
      type: "text"
      required: true
      description: "Encoded recipient identification (e.g., ID photo data)"
    - name: "confirmedByDriver"
      type: "boolean"
      required: true
      validation: "defaults to true"
      description: "Whether driver confirmed the delivery"
    - name: "createdByUser"
      type: "User (ManyToOne)"
      required: true
      description: "Driver who created this POD"
    - name: "createdAt"
      type: "DateTimeImmutable"
      required: true
      description: "Creation timestamp"

  relations:
    - target: "RouteStop"
      type: "one-to-one"
      cardinality: "1"
      description: "One POD per route stop (CASCADE on delete)"
    - target: "Shipment"
      type: "many-to-one"
      cardinality: "0..1"
      description: "Optional linked shipment"
    - target: "User"
      type: "many-to-one"
      cardinality: "1"
      description: "Driver who created this record"

  invariants:
    - "Each RouteStop can have at most one Pod (OneToOne)"
    - "signedByName and recipientIdEncoded are required for valid POD"
    - "createdByUser must be a driver"

  source_files:
    - "backend/src/Entity/Pod.php"
    - "backend/src/Repository/PodRepository.php"
    - "backend/src/Service/PodStorageInterface.php"
    - "backend/src/Service/DatabasePodStorage.php"

  extracted_at: "2026-02-19"
