# Entity Specification: Vehicle
# Generated by /workflows:discover on 2026-02-19

entity:
  name: "Vehicle"
  type: "entity"
  description: "GPS-tracked vehicle. Central entity for fleet tracking, linked to Traccar for real-time position data."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      validation: "Internal PK, never exposed"
      description: "Internal primary key for joins"
    - name: "publicId"
      type: "ULID"
      required: true
      validation: "Unique, auto-generated on PrePersist"
      description: "Public identifier exposed in APIs and URLs"
    - name: "name"
      type: "string(120)"
      required: true
      validation: "max 120 chars"
      description: "Human-readable vehicle name/plate"
    - name: "traccarDeviceId"
      type: "integer"
      required: false
      validation: "nullable"
      description: "Traccar device ID for GPS integration"
    - name: "isActive"
      type: "boolean"
      required: true
      validation: "defaults to true"
      description: "Whether vehicle is active in the fleet"
    - name: "createdAt"
      type: "DateTimeImmutable"
      required: true
      validation: "auto-set via PrePersist"
      description: "Creation timestamp"
    - name: "updatedAt"
      type: "DateTimeImmutable"
      required: true
      validation: "auto-set via PrePersist/PreUpdate"
      description: "Last update timestamp"

  relations:
    - target: "VehicleLastPosition"
      type: "one-to-one"
      cardinality: "0..1"
      description: "Latest known GPS position for efficient querying"
    - target: "VehiclePosition"
      type: "one-to-many"
      cardinality: "0..*"
      description: "Historical GPS positions"
    - target: "VehicleCheckpoint"
      type: "one-to-one"
      cardinality: "0..1"
      description: "Position ingestion checkpoint for Traccar sync"
    - target: "CustomerVehicle"
      type: "one-to-many"
      cardinality: "0..*"
      description: "Customer assignments (multi-tenant visibility)"
    - target: "Route"
      type: "one-to-many"
      cardinality: "0..*"
      description: "Delivery routes assigned to this vehicle"

  invariants:
    - "Vehicle name must be non-empty and ≤120 characters"
    - "traccarDeviceId links to external Traccar system and may be null if not yet synced"

  lifecycle:
    states: ["active", "inactive"]
    transitions:
      - from: "active"
        to: "inactive"
        trigger: "isActive set to false"

  source_files:
    - "backend/src/Entity/Vehicle.php"
    - "backend/src/Repository/VehicleRepository.php"

  extracted_at: "2026-02-19"
