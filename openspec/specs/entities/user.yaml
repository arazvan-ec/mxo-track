# Entity Specification: User
# Generated by /workflows:discover on 2026-02-19

entity:
  name: "User"
  type: "entity"
  description: "Authenticated user. Implements Symfony UserInterface. Supports roles: ADMIN, OPERATOR, CUSTOMER, DRIVER. Optional customer association for multi-tenant scoping."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      description: "Internal primary key"
    - name: "publicId"
      type: "ULID"
      required: true
      description: "Public identifier"
    - name: "email"
      type: "string(180)"
      required: true
      validation: "unique, lowercased on construct"
      description: "Login email (user identifier)"
    - name: "roles"
      type: "json array"
      required: true
      validation: "ROLE_USER always included"
      description: "User roles (from UserRole enum)"
    - name: "passwordHash"
      type: "string(255)"
      required: true
      description: "Hashed password (column: password_hash)"
    - name: "customer"
      type: "Customer (ManyToOne)"
      required: false
      description: "Customer association for tenant scoping"
    - name: "isActive"
      type: "boolean"
      required: true
      validation: "defaults to true"
      description: "Whether user can authenticate (checked by UserChecker)"
    - name: "createdAt"
      type: "DateTimeImmutable"
      required: true
      description: "Creation timestamp"
    - name: "updatedAt"
      type: "DateTimeImmutable"
      required: true
      description: "Last update timestamp"

  relations:
    - target: "Customer"
      type: "many-to-one"
      cardinality: "0..1"
      description: "Customer association (SET NULL on delete)"

  invariants:
    - "Email is always stored lowercase"
    - "getRoles() always includes ROLE_USER"
    - "UserChecker blocks authentication if isActive=false"
    - "ROLE_CUSTOMER and ROLE_DRIVER users should have a customer association for tenant filter"

  lifecycle:
    states: ["active", "inactive"]
    transitions:
      - from: "active"
        to: "inactive"
        trigger: "setActive(false)"

  source_files:
    - "backend/src/Entity/User.php"
    - "backend/src/Repository/UserRepository.php"
    - "backend/src/Enum/UserRole.php"
    - "backend/src/Security/UserChecker.php"

  extracted_at: "2026-02-19"
