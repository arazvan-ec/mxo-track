# Entity Specification: RouteStop
# Generated by /workflows:discover on 2026-02-19

entity:
  name: "RouteStop"
  type: "entity"
  description: "Individual delivery stop within a Route. Tracks delivery status and exception handling."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      description: "Internal primary key"
    - name: "publicId"
      type: "ULID"
      required: true
      description: "Public identifier"
    - name: "route"
      type: "Route (ManyToOne)"
      required: true
      description: "Parent route"
    - name: "sequence"
      type: "integer"
      required: true
      description: "Stop order in the route"
    - name: "address"
      type: "string(255)"
      required: true
      description: "Delivery address"
    - name: "status"
      type: "RouteStopStatus enum"
      required: true
      description: "Current stop status"
    - name: "deliveredAt"
      type: "DateTimeImmutable"
      required: false
      description: "Timestamp when marked delivered"
    - name: "exceptionCode"
      type: "ExceptionCode enum"
      required: false
      description: "Exception code if delivery failed"
    - name: "exceptionNotes"
      type: "text"
      required: false
      description: "Driver notes for exception"

  relations:
    - target: "Route"
      type: "many-to-one"
      cardinality: "1"
      description: "Parent route (CASCADE on delete)"
    - target: "Pod"
      type: "one-to-one"
      cardinality: "0..1"
      description: "Proof of Delivery record"

  invariants:
    - "markDelivered() clears exception fields and sets deliveredAt"
    - "markException() sets exceptionCode and exceptionNotes"
    - "A stop cannot be both DELIVERED and EXCEPTION simultaneously"

  lifecycle:
    states: ["PENDING", "DELIVERED", "EXCEPTION"]
    transitions:
      - from: "PENDING"
        to: "DELIVERED"
        trigger: "markDelivered() called"
      - from: "PENDING"
        to: "EXCEPTION"
        trigger: "markException() called with code and notes"

  source_files:
    - "backend/src/Entity/RouteStop.php"
    - "backend/src/Repository/RouteStopRepository.php"
    - "backend/src/Enum/RouteStopStatus.php"
    - "backend/src/Enum/ExceptionCode.php"

  extracted_at: "2026-02-19"
