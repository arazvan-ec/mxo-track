        to: "IN_HUB"
        trigger: "ShipmentEvent with type IN_HUB"
      - from: "IN_HUB"
        to: "IN_TRANSIT"
        trigger: "ShipmentEvent with type IN_TRANSIT"
      - from: "IN_TRANSIT"
        to: "OUT_FOR_DELIVERY"
        trigger: "ShipmentEvent with type OUT_FOR_DELIVERY"
      - from: "OUT_FOR_DELIVERY"
        to: "DELIVERED"
        trigger: "ShipmentEvent with type DELIVERED"
      - from: "*"
        to: "EXCEPTION"
        trigger: "ShipmentEvent with type EXCEPTION (from any state)"

  source_files:
