  invariants:
    - "Shipment reference must be unique across all customers"
    - "Shipment must always belong to a Customer (CustomerScopedEntityInterface)"
    - "Lifecycle is tracked exclusively via ShipmentEvent entities"

  lifecycle:
    states: ["CREATED", "PICKED_UP", "IN_HUB", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED", "EXCEPTION"]
    transitions:
      - from: "CREATED"
        to: "PICKED_UP"
