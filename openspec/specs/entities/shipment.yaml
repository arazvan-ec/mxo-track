entity:
  name: "Shipment"
  type: "aggregate"
  description: "Shipment tracking entity. Customer-scoped (multi-tenant). Lifecycle tracked via ShipmentEvent."

  attributes:
    - name: "id"
      type: "BIGINT (auto-increment)"
      required: true
      description: "Internal primary key"
    - name: "publicId"
      type: "ULID"
      required: true
      description: "Public identifier (used as shipment_public_id in Driver API)"
    - name: "reference"
      type: "string(80)"
      required: true
      validation: "unique"
      description: "Business reference number"
    - name: "customer"
      type: "Customer (ManyToOne)"
      required: true
      description: "Owning customer (tenant)"
    - name: "createdAt"
      type: "DateTimeImmutable"
      required: true
      description: "Creation timestamp"

  relations:
    - target: "Customer"
      type: "many-to-one"
      cardinality: "1"
      description: "Owning customer for multi-tenant scoping"
    - target: "ShipmentEvent"
      type: "one-to-many"
      cardinality: "0..*"
      description: "Lifecycle events (CREATED, IN_TRANSIT, DELIVERED, etc.)"
    - target: "Pod"
      type: "one-to-many"
