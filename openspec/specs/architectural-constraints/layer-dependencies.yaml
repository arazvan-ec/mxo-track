# Architectural Constraints: Layer Dependencies
# Generated by /workflows:discover on 2026-02-19

architectural_constraints:
  category: "Layer Dependencies"
  description: "Constraints governing dependency direction and module boundaries in the Symfony application"

  layer_constraints:
    - name: "Entity Layer Purity"
      description: "Entities contain only data mapping and simple domain logic. No service/repository dependencies."
      rule: "src/Entity/ cannot import from src/Service/ or src/Controller/"
      enforcement: "code review"
      violations_found: 0

    - name: "Controller → Service Direction"
      description: "Controllers delegate business logic to Services. No raw Doctrine queries in controllers."
      layers:
        - { name: "Controller", can_depend_on: ["Service", "Repository", "Entity", "Dto", "Enum"] }
        - { name: "Service", can_depend_on: ["Repository", "Entity", "Enum"] }
        - { name: "Repository", can_depend_on: ["Entity"] }
        - { name: "Entity", can_depend_on: ["Enum"] }
        - { name: "Command", can_depend_on: ["Service", "Repository", "Entity"] }
      violations_found: 0

  pattern_constraints:
    - name: "Repository Pattern"
      description: "All data access through Doctrine repositories extending ServiceEntityRepository"
      applies_to: "backend/src/Repository/"
      pattern: "Repository"
      anti_patterns: ["Direct DQL in controllers", "EntityManager usage in controllers"]

    - name: "PublicIdTrait for All Entities"
      description: "All entities (except CustomerVehicle) must use PublicIdTrait for dual identity"
      applies_to: "backend/src/Entity/"
      required: true

    - name: "DTO Pattern for Input Validation"
      description: "API inputs use DTOs with fromArray() factory + Symfony Validator constraints"
      applies_to: "backend/src/Dto/"
      pattern: "DTO with fromArray()"
      anti_patterns: ["Direct request body parsing in controllers"]

    - name: "ApiErrorResponder for Error Responses"
      description: "All API error responses must use ApiErrorResponder for consistent format"
      applies_to: "backend/src/Controller/"
      pattern: "ApiErrorResponder"
      anti_patterns: ["Manual JsonResponse for errors"]

  security_constraints:
    - name: "CSRF Protection"
      description: "All form submissions require CSRF tokens"
      enforcement: "framework.yaml csrf_protection: true"
      scope: "All web forms"

    - name: "Session Security"
      description: "Sessions stored in Redis with secure cookie settings"
      enforcement: "framework.yaml session configuration"
      scope: "All authenticated sessions"

    - name: "Mercure Token Authorization"
      description: "Mercure subscriber tokens authorized per topic via TopicResolver"
      enforcement: "TopicResolver.php"
      scope: "All Mercure SSE subscriptions"

  technology_constraints:
    - name: "Symfony 7.4 LTS Lock"
      description: "No Symfony 8.x components allowed. Strict lock enforced via composer.json"
      allowed: ["symfony/* 7.4.*"]
      forbidden: ["symfony/* >=8.0"]
      reason: "LTS stability, controlled upgrade path"

    - name: "PHP 8.4 Required"
      description: "Uses modern PHP features: enums, readonly properties, typed properties"
      allowed: ["php >=8.2"]
      forbidden: []
      reason: "Modern PHP features and performance"

    - name: "Doctrine ORM 3.x"
      description: "Attribute-based mapping only (no XML/YAML). Requires underscore_number_aware naming strategy."
      allowed: ["doctrine/orm ^3.2"]
      forbidden: ["doctrine/orm <3.0"]
      reason: "Modern Doctrine with attribute mapping"

  performance_constraints:
    - name: "VehicleLastPosition Materialization"
      description: "Latest vehicle position is materialized for O(1) fleet queries instead of scanning all positions"
      threshold: "Fleet map query must not scan vehicle_positions table"
      implementation: "VehicleLastPosition entity updated via refresh()"

  source_evidence:
    - "backend/composer.json (Symfony lock)"
    - "backend/config/packages/doctrine.yaml (naming strategy)"
    - "backend/config/packages/security.yaml (access control)"
    - "backend/config/packages/framework.yaml (session, CSRF)"
    - "docs/DECISIONS.md"

  extracted_at: "2026-02-19"
