stack:
  language: "php"
  framework: "symfony"
  paradigm: "oop"
  type_system: "strong-dynamic"

architecture:
  pattern: "mvc"
  layers:
    - name: Entity
      path: backend/src/Entity/
      depends_on: []
    - name: Repository
      path: backend/src/Repository/
      depends_on: [Entity]
    - name: Service
      path: backend/src/Service/
      depends_on: [Entity, Repository]
    - name: Controller
      path: backend/src/Controller/
      depends_on: [Entity, Repository, Service]
    - name: EventSubscriber
      path: backend/src/EventSubscriber/
      depends_on: [Entity, Service]
    - name: Command
      path: backend/src/Command/
      depends_on: [Entity, Repository, Service]
    - name: Security
      path: backend/src/Security/
      depends_on: [Entity]
  separation_enforced: true

patterns_detected:
  data_access: "repository"
  dependency_management: "container-autowire"
  error_handling: "exceptions"
  async_pattern: "none"
  testing_approach: "none"
  http_client_pattern: "vendor-sdk"
  external_api_integration: "adapter-only"
  serialization_strategy: "manual-dto"
  multi_platform_output: "single-format"
  data_aggregation_pattern: "single-source"

solid_relevance:
  srp:
    relevance: "high"
    metric: "classes ≤200 LOC, ≤7 public methods"
    when_violated: "Extract Class or Extract Service, then compose via DI"
    reference_good: "backend/src/Service/DriverActionService.php"
  ocp:
    relevance: "medium"
    metric: "no switch/if-else chains by type; use enums + strategy"
    when_violated: "Strategy pattern or enum-based dispatch"
    reference_good: "backend/src/Enum/ShipmentEventType.php"
  lsp:
    relevance: "low"
    metric: "minimal inheritance; traits used instead (PublicIdTrait)"
    when_violated: "Composition over Inheritance — already the default"
  isp:
    relevance: "medium"
    metric: "interfaces ≤5 methods"
    when_violated: "Split into focused interfaces"
    reference_good: "backend/src/Service/PodStorageInterface.php"
  dip:
    relevance: "medium"
    metric: "Services depend on interfaces where external systems are involved"
    when_violated: "Port interface in Service, Adapter in implementation"
    reference_good: "backend/src/Service/PodStorageInterface.php"

conventions:
  naming:
    classes: "PascalCase"
    methods: "camelCase"
    files: "match-class-name"
  structure:
    entity_path: backend/src/Entity/
    repository_path: backend/src/Repository/
    service_path: backend/src/Service/
    controller_path: backend/src/Controller/
    command_path: backend/src/Command/
    dto_path: backend/src/Dto/
    enum_path: backend/src/Enum/
    security_path: backend/src/Security/
    subscriber_path: backend/src/EventSubscriber/
    template_path: backend/templates/
    migration_path: backend/migrations/
    fixture_path: backend/src/DataFixtures/
