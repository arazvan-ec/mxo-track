    repository_path: backend/src/Repository/
    service_path: backend/src/Service/
    controller_path: backend/src/Controller/
    command_path: backend/src/Command/
    dto_path: backend/src/Dto/
    enum_path: backend/src/Enum/
    security_path: backend/src/Security/
    subscriber_path: backend/src/EventSubscriber/
    template_path: backend/templates/
    migration_path: backend/migrations/
    fixture_path: backend/src/DataFixtures/
    config_path: backend/config/
  reference_files:
    entity: backend/src/Entity/Vehicle.php
    entity_with_lifecycle: backend/src/Entity/Route.php
    entity_scoped: backend/src/Entity/Shipment.php
    trait: backend/src/Entity/Concerns/PublicIdTrait.php
    repository: backend/src/Repository/VehicleRepository.php
    service: backend/src/Service/TraccarApiClient.php
    service_interface: backend/src/Service/PodStorageInterface.php
    controller_api: backend/src/Controller/DriverApiController.php
    controller_admin_crud: backend/src/Controller/Admin/RouteAdminController.php
    controller_web: backend/src/Controller/AdminController.php
