# API Contract: Driver API
# Generated by /workflows:discover on 2026-02-19

api_contract:
  name: "Driver API"
  version: "1.0"
  base_path: "/api/driver"
  description: "Mobile API for delivery drivers. Handles route management, delivery confirmation (POD), and exception reporting."

  endpoints:
    - method: "GET"
      path: "/api/driver/routes"
      description: "List routes assigned to the authenticated driver"
      parameters: []
      request:
        content_type: "none"
      responses:
        - status: 200
          description: "Success — array of routes with stops"
          schema:
            type: "array"
            items:
              properties:
                public_id: { type: "string (ULID)" }
                name: { type: "string" }
                status: { type: "string (RouteStatus)" }
                stops: { type: "array of RouteStop" }
      authentication: "session (ROLE_DRIVER or ROLE_ADMIN)"

    - method: "POST"
      path: "/api/driver/routes/{publicId}/start"
      description: "Start a route (transition PLANNED → ACTIVE)"
      parameters:
        - name: "publicId"
          in: "path"
          type: "string (ULID)"
          required: true
      responses:
        - status: 200
          description: "Route started"
        - status: 400
          description: "Route not in PLANNED status"
        - status: 404
          description: "Route not found"
      authentication: "session (ROLE_DRIVER or ROLE_ADMIN)"

    - method: "POST"
      path: "/api/driver/routes/{publicId}/finish"
      description: "Finish a route (transition ACTIVE → DONE)"
      parameters:
        - name: "publicId"
          in: "path"
          type: "string (ULID)"
          required: true
      responses:
        - status: 200
          description: "Route finished"
        - status: 400
          description: "Route not in ACTIVE status"
      authentication: "session (ROLE_DRIVER or ROLE_ADMIN)"

    - method: "POST"
      path: "/api/driver/stops/{publicId}/deliver"
      description: "Mark a stop as delivered with Proof of Delivery"
      parameters:
        - name: "publicId"
          in: "path"
          type: "string (ULID)"
          required: true
      request:
        content_type: "application/json"
        schema:
          properties:
            client_action_id: { type: "string (UUID)", required: true }
            signed_by_name: { type: "string", required: true }
            recipient_id: { type: "string", required: true }
            shipment_public_id: { type: "string (ULID)", required: false }
      responses:
        - status: 200
          description: "Stop delivered, POD created"
        - status: 409
          description: "Duplicate action (idempotency — same client_action_id)"
        - status: 422
          description: "Validation error"
      authentication: "session (ROLE_DRIVER or ROLE_ADMIN)"

    - method: "POST"
      path: "/api/driver/stops/{publicId}/exception"
      description: "Mark a stop as exception (failed delivery)"
      parameters:
        - name: "publicId"
          in: "path"
          type: "string (ULID)"
          required: true
      request:
        content_type: "application/json"
        schema:
          properties:
            client_action_id: { type: "string (UUID)", required: true }
            exception_code: { type: "string (ExceptionCode)", required: true }
            notes: { type: "string", required: true }
      responses:
        - status: 200
          description: "Exception recorded"
        - status: 409
          description: "Duplicate action"
        - status: 422
          description: "Validation error"
      authentication: "session (ROLE_DRIVER or ROLE_ADMIN)"

  schemas:
    DeliverStopInput:
      type: object
      properties:
        client_action_id: { type: "string (UUID)" }
        signed_by_name: { type: "string" }
        recipient_id: { type: "string" }
        shipment_public_id: { type: "string (ULID), optional" }
    ExceptionStopInput:
      type: object
      properties:
        client_action_id: { type: "string (UUID)" }
        exception_code: { type: "string (ExceptionCode enum)" }
        notes: { type: "string" }

  source_files:
    - "backend/src/Controller/DriverApiController.php"
    - "backend/src/Dto/Driver/DeliverStopInput.php"
    - "backend/src/Dto/Driver/ExceptionStopInput.php"

  extracted_at: "2026-02-19"
