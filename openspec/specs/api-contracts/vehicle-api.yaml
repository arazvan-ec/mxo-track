# API Contract: Vehicle/GPS API
# Generated by /workflows:discover on 2026-02-19

api_contract:
  name: "Vehicle API"
  version: "1.0"
  base_path: "/api/vehicles"
  description: "Vehicle tracking API. Provides fleet positions, vehicle history, and real-time position data."

  endpoints:
    - method: "GET"
      path: "/api/vehicles/fleet-positions"
      description: "Get latest positions for all active vehicles in the fleet"
      responses:
        - status: 200
          description: "Array of vehicle positions with vehicle info"
      authentication: "session (authenticated)"

    - method: "GET"
      path: "/api/vehicles/{publicId}/positions"
      description: "Get position history for a specific vehicle"
      parameters:
        - name: "publicId"
          in: "path"
          type: "string (ULID)"
          required: true
        - name: "since"
          in: "query"
          type: "string (ISO 8601)"
          required: false
          description: "Filter positions since this timestamp"
      responses:
        - status: 200
          description: "Array of historical positions"
        - status: 404
          description: "Vehicle not found"
      authentication: "session (authenticated)"

    - method: "POST"
      path: "/api/vehicles/dev-push-position"
      description: "Development-only: push a GPS position manually"
      request:
        content_type: "application/json"
        schema:
          properties:
            vehicle_public_id: { type: "string (ULID)" }
            lat: { type: "float" }
            lng: { type: "float" }
            speed: { type: "float, optional" }
      responses:
        - status: 200
          description: "Position stored"
      authentication: "session (ROLE_ADMIN)"

  source_files:
    - "backend/src/Controller/VehicleApiController.php"
    - "backend/src/Controller/AdminDevPushPositionController.php"

  extracted_at: "2026-02-19"
