# API Contract: Admin Web Routes
# Generated by /workflows:discover on 2026-02-19
# Updated by /workflows:compound on 2026-02-20 (Phase 4 CRUDs)

api_contract:
  name: "Admin Web"
  version: "1.1"
  base_path: "/admin"
  description: "Admin dashboard, CRUD management, and fleet map. HTML responses via Twig templates."

  security:
    class_level_isgranted: "ROLE_OPERATOR on all admin controllers"
    csrf: "Scoped tokens on all destructive POST actions (delete-{entity}-{publicId})"
    xss: "JSON_HEX_TAG|JSON_HEX_APOS|JSON_HEX_AMP on all json_encode in templates"

  endpoints:
    # Dashboard
    - method: "GET"
      path: "/admin"
      description: "Admin dashboard with fleet metrics, recent activity"
      controller: "AdminController::dashboard"
      responses:
        - status: 200
          description: "HTML admin dashboard page"
      authentication: "session (ROLE_OPERATOR)"

    # Vehicle CRUD
    - method: "GET"
      path: "/admin/vehicles"
      description: "Vehicle list with pagination and last position"
      controller: "VehicleAdminController::index"
      responses:
        - status: 200
          description: "HTML vehicle list page"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/vehicles/new"
      description: "Create new vehicle"
      controller: "VehicleAdminController::new"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/vehicles/{publicId}/edit"
      description: "Edit vehicle"
      controller: "VehicleAdminController::edit"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/vehicles/{publicId}/delete"
      description: "Soft-delete vehicle (set active=false)"
      controller: "VehicleAdminController::delete"
      csrf_token: "delete-vehicle-{publicId}"
      authentication: "session (ROLE_OPERATOR)"

    # Driver CRUD
    - method: "GET"
      path: "/admin/drivers"
      description: "Driver list with pagination"
      controller: "DriverAdminController::index"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/drivers/new"
      description: "Create new driver with password"
      controller: "DriverAdminController::new"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/drivers/{publicId}/edit"
      description: "Edit driver (optional password change)"
      controller: "DriverAdminController::edit"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/drivers/{publicId}/delete"
      description: "Soft-delete driver (set active=false)"
      controller: "DriverAdminController::delete"
      csrf_token: "delete-driver-{publicId}"
      authentication: "session (ROLE_OPERATOR)"

    # Route CRUD
    - method: "GET"
      path: "/admin/routes"
      description: "Route list with pagination, status filter, stop counts"
      controller: "RouteAdminController::index"
      query_params:
        - name: "status"
          type: "string"
          description: "Filter by RouteStatus enum value"
        - name: "page"
          type: "int"
          description: "Page number (default 1)"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/routes/new"
      description: "Create new route"
      controller: "RouteAdminController::new"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/routes/{publicId}/edit"
      description: "Edit route with stop list and add-stop form"
      controller: "RouteAdminController::edit"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/routes/{publicId}/delete"
      description: "Cancel route (set status=CANCELLED)"
      controller: "RouteAdminController::delete"
      csrf_token: "delete-route-{publicId}"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/routes/{publicId}/stops/add"
      description: "Add stop to route with auto-sequence"
      controller: "RouteAdminController::addStop"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/routes/{publicId}/stops/{stopPublicId}/delete"
      description: "Remove stop from route (hard delete with cross-route validation)"
      controller: "RouteAdminController::deleteStop"
      csrf_token: "delete-stop-{stopPublicId}"
      authentication: "session (ROLE_OPERATOR)"

    # Customer CRUD
    - method: "GET"
      path: "/admin/customers"
      description: "Customer list with pagination"
      controller: "CustomerAdminController::index"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/customers/new"
      description: "Create new customer"
      controller: "CustomerAdminController::new"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/customers/{publicId}/edit"
      description: "Edit customer"
      controller: "CustomerAdminController::edit"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/customers/{publicId}/delete"
      description: "Soft-delete customer (set active=false)"
      controller: "CustomerAdminController::delete"
      csrf_token: "delete-customer-{publicId}"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/customers/{publicId}/vehicles"
      description: "Manage vehicle-customer assignments"
      controller: "CustomerAdminController::vehicles"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/customers/{publicId}/users/new"
      description: "Create customer user with ROLE_CUSTOMER"
      controller: "CustomerAdminController::newUser"
      authentication: "session (ROLE_OPERATOR)"

    # User CRUD
    - method: "GET"
      path: "/admin/users"
      description: "User list with pagination"
      controller: "UserAdminController::index"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/users/new"
      description: "Create new admin/operator user"
      controller: "UserAdminController::new"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET/POST"
      path: "/admin/users/{publicId}/edit"
      description: "Edit user"
      controller: "UserAdminController::edit"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/users/{publicId}/delete"
      description: "Soft-delete user (set active=false)"
      controller: "UserAdminController::delete"
      csrf_token: "delete-user-{publicId}"
      authentication: "session (ROLE_OPERATOR)"

    # CSV Import
    - method: "GET"
      path: "/admin/shipments/import"
      description: "CSV import form for shipments with recent runs"
      controller: "AdminShipmentController::import"
      authentication: "session (ROLE_OPERATOR)"

    - method: "POST"
      path: "/admin/shipments/import"
      description: "Process CSV shipment import"
      controller: "AdminShipmentController::import"
      csrf_token: "import-shipments"
      request:
        content_type: "multipart/form-data"
        fields:
          - name: "customer_id"
            type: "ULID string (publicId)"
          - name: "csv_file"
            type: "file"
      authentication: "session (ROLE_OPERATOR)"

    # Fleet Map
    - method: "GET"
      path: "/fleet/map"
      description: "Real-time fleet tracking map with Mercure SSE integration"
      controller: "FleetMapController::index"
      responses:
        - status: 200
          description: "Full-screen HTML map page (Leaflet + Alpine.js)"
      authentication: "session (ROLE_OPERATOR)"

    - method: "GET"
      path: "/fleet/map/data"
      description: "JSON vehicle position data for AJAX refresh"
      controller: "FleetMapController::data"
      responses:
        - status: 200
          content_type: "application/json"
      authentication: "session (ROLE_OPERATOR)"

    # Customer Dashboard
    - method: "GET"
      path: "/customer/dashboard"
      description: "Customer KPI dashboard with route progress and vehicle map"
      controller: "CustomerDashboardController::dashboard"
      authentication: "session (ROLE_CUSTOMER)"

    - method: "GET"
      path: "/customer/dashboard/kpis"
      description: "JSON KPI data for customer dashboard refresh"
      controller: "CustomerDashboardController::kpis"
      responses:
        - status: 200
          content_type: "application/json"
      authentication: "session (ROLE_CUSTOMER)"

    # Customer Routes
    - method: "GET"
      path: "/customer/routes"
      description: "Customer route list with pagination"
      controller: "CustomerRouteController::index"
      authentication: "session (ROLE_CUSTOMER)"

    - method: "GET"
      path: "/customer/routes/{publicId}"
      description: "Customer route detail with stop map and progress"
      controller: "CustomerRouteController::show"
      authentication: "session (ROLE_CUSTOMER)"

    # Customer Shipments
    - method: "GET"
      path: "/customer/shipments"
      description: "Customer shipment list with pagination and search"
      controller: "CustomerShipmentController::index"
      authentication: "session (ROLE_CUSTOMER)"

    - method: "GET"
      path: "/customer/shipments/{publicId}"
      description: "Customer shipment detail with event timeline"
      controller: "CustomerShipmentController::show"
      authentication: "session (ROLE_CUSTOMER)"

    # Driver Web Interface
    - method: "GET"
      path: "/driver/routes"
      description: "Driver route list (assigned routes)"
      controller: "DriverWebController::index"
      authentication: "session (ROLE_DRIVER)"

    - method: "GET"
      path: "/driver/routes/{publicId}"
      description: "Driver route execution view with stops, delivery, exceptions"
      controller: "DriverWebController::show"
      authentication: "session (ROLE_DRIVER)"

    # Login
    - method: "GET"
      path: "/login"
      description: "Login page"
      responses:
        - status: 200
          description: "HTML login form"
      authentication: "PUBLIC_ACCESS"

    # Root dashboard redirect
    - method: "GET"
      path: "/"
      description: "Dashboard home page (redirects based on role)"
      authentication: "session (authenticated)"

  source_files:
    - "backend/src/Controller/AdminController.php"
    - "backend/src/Controller/AdminShipmentController.php"
    - "backend/src/Controller/Admin/VehicleAdminController.php"
    - "backend/src/Controller/Admin/DriverAdminController.php"
    - "backend/src/Controller/Admin/RouteAdminController.php"
    - "backend/src/Controller/Admin/CustomerAdminController.php"
    - "backend/src/Controller/Admin/UserAdminController.php"
    - "backend/src/Controller/FleetMapController.php"
    - "backend/src/Controller/Customer/CustomerDashboardController.php"
    - "backend/src/Controller/Customer/CustomerRouteController.php"
    - "backend/src/Controller/Customer/CustomerShipmentController.php"
    - "backend/src/Controller/DriverWebController.php"
    - "backend/src/Controller/DashboardController.php"
    - "backend/src/Controller/SecurityController.php"

  extracted_at: "2026-02-19"
  updated_at: "2026-02-20"
  updated_by: "/workflows:compound (phase-4-crud-dashboards)"
